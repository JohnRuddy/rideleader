{% extends "base.html" %}
{% block title %}Sign in · Ride Leader Kit{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Enter your email and we'll send you a link. No password to remember.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login_request') }}" class="stack">
    {{ csrf_input() }}
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label>Email <input type="email" name="email" autocomplete="email" required autofocus></label>
    <button type="submit" class="btn">Email me a link</button>
  </form>
</section>
{% endblock %}
